<main class="auth-page">
  <section class="auth-card">
    <h1 class="auth-title">Forgot Password</h1>
    <p class="auth-subtitle">Enter your account email to receive a password reset link.</p>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-field">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-input"
          placeholder="name@company.com"
        />
        <small class="field-error" *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
          Valid email required.
        </small>
      </div>

      <div class="auth-success" role="status" *ngIf="message">{{ message }}</div>
      <div class="auth-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button
        type="submit"
        [disabled]="forgotForm.invalid || isSubmitting"
        class="auth-submit"
      >
        {{ isSubmitting ? 'Sending Link...' : 'Send Reset Link' }}
      </button>
    </form>

    <div class="card-footer">
      <a routerLink="/login" class="secondary-btn">Back to Sign In</a>
    </div>
  </section>
</main>
