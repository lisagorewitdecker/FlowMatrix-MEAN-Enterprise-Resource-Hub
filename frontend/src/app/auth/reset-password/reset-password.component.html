<main class="auth-page">
  <section class="auth-card">
    <h1 class="auth-title">Set New Password</h1>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-field">
        <label for="password">New Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-input"
          placeholder="••••••••"
        />
        <small class="field-error" *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.errors?.['passwordStrength']">
          Must be 8+ chars with uppercase, lowercase, number, and special character.
        </small>
      </div>

      <div class="form-field">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          class="form-input"
          placeholder="••••••••"
        />
        <small class="field-error" *ngIf="resetForm.hasError('passwordMismatch') && resetForm.get('confirmPassword')?.touched">
          Passwords do not match.
        </small>
      </div>

      <div class="auth-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="auth-success" role="status" *ngIf="successMessage">{{ successMessage }}</div>

      <button
        type="submit"
        [disabled]="resetForm.invalid || isSubmitting"
        class="auth-submit"
      >
        {{ isSubmitting ? 'Updating Password...' : 'Update Password' }}
      </button>
    </form>

    <div class="card-footer">
      <a routerLink="/login" class="secondary-btn">Back to Sign In</a>
    </div>
  </section>
</main>
